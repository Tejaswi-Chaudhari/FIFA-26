<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA World Cup 2026 — Live Bracket</title>
<style>
  :root {
    --bg: #06101f;
    --surface: #0d1f3c;
    --card: #112244;
    --card-hover: #163060;
    --border: #1e3a6e;
    --gold: #f5c518;
    --green: #00e096;
    --red: #ff4d4f;
    --blue: #4fa3ff;
    --text: #e8f0ff;
    --muted: #7a98cc;
    --live-pulse: #ff4d4f;
    --connector: #1e3a6e;
    --winner-bg: rgba(0,224,150,0.12);
    --winner-border: rgba(0,224,150,0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  .header {
    text-align: center;
    padding: 32px 20px 24px;
    background: radial-gradient(ellipse at top, rgba(245,197,24,0.08) 0%, transparent 65%);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
    background-color: rgba(6,16,31,0.92);
  }

  .header-trophy { font-size: 2.4rem; line-height: 1; margin-bottom: 6px; }

  .header h1 {
    font-size: clamp(1.4rem, 3.5vw, 2.2rem);
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #f5c518, #ffedaa, #f5c518);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .header-sub {
    color: var(--muted);
    font-size: 0.88rem;
    margin-top: 4px;
  }

  .status-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .status-text { color: var(--muted); font-size: 0.8rem; }

  .btn {
    padding: 6px 16px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
    transition: all 0.15s;
  }

  .btn-gold { background: var(--gold); color: #1a1000; }
  .btn-gold:hover { transform: scale(1.05); filter: brightness(1.1); }

  .tab-row {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-top: 12px;
  }

  .tab {
    padding: 5px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.8rem;
    transition: all 0.15s;
  }

  .tab.active {
    background: var(--gold);
    color: #1a1000;
    font-weight: 700;
    border-color: var(--gold);
  }

  /* ── ALERTS ── */
  .alert {
    max-width: 700px;
    margin: 16px auto;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 0.85rem;
    text-align: center;
    display: none;
  }

  .alert.error { background: rgba(255,77,79,0.15); border: 1px solid rgba(255,77,79,0.4); color: #ff8a8b; display: block; }
  .alert.info  { background: rgba(79,163,255,0.12); border: 1px solid rgba(79,163,255,0.3); color: var(--blue); display: block; }

  /* ── LIVE SCORES BAR ── */
  #live-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    overflow-x: auto;
    white-space: nowrap;
    display: none;
  }

  #live-bar.visible { display: block; }
  .live-bar-label { color: var(--red); font-size: 0.7rem; font-weight: 700; letter-spacing: 1px; margin-right: 12px; vertical-align: middle; }

  .live-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    margin-right: 8px;
    font-size: 0.78rem;
    vertical-align: middle;
  }

  .live-chip.is-live { border-color: var(--red); }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--red); animation: pulse 1.2s infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  /* ── VIEWS ── */
  #view-bracket { display: block; }
  #view-schedule { display: none; }

  /* ── BRACKET ── */
  .bracket-scroll {
    overflow-x: auto;
    padding: 28px 20px 60px;
    min-height: 400px;
  }

  .bracket {
    display: flex;
    align-items: flex-start;
    gap: 0;
    min-width: max-content;
  }

  .round-col {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .round-label {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gold);
    text-align: center;
    height: 28px;
    display: flex;
    align-items: center;
    white-space: nowrap;
    padding: 0 20px;
  }

  .matches-col {
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    flex: 1;
  }

  .match-wrap {
    display: flex;
    align-items: center;
    position: relative;
  }

  /* connector lines */
  .connector {
    width: 24px;
    position: relative;
    align-self: stretch;
    flex-shrink: 0;
  }

  .connector::before,
  .connector::after {
    content: '';
    position: absolute;
    background: var(--connector);
  }

  .connector.left::after {
    width: 24px;
    height: 1px;
    top: 50%;
    left: 0;
    transform: translateY(-50%);
  }

  .connector.right::before {
    width: 24px;
    height: 1px;
    top: 50%;
    right: 0;
    transform: translateY(-50%);
  }

  /* ── MATCH CARD ── */
  .match-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 210px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }

  .match-card:hover {
    background: var(--card-hover);
    border-color: var(--blue);
    transform: translateY(-1px);
    box-shadow: 0 6px 24px rgba(0,0,0,0.4);
  }

  .match-card.is-live { border-color: var(--red); }
  .match-card.is-live::before {
    content: 'LIVE';
    position: absolute;
    top: 6px;
    right: 8px;
    font-size: 0.55rem;
    font-weight: 800;
    letter-spacing: 1px;
    color: var(--red);
    background: rgba(255,77,79,0.15);
    padding: 2px 6px;
    border-radius: 4px;
  }

  .match-meta {
    padding: 6px 10px 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }

  .match-date { font-size: 0.65rem; color: var(--muted); }
  .match-status { font-size: 0.62rem; font-weight: 600; }
  .match-status.finished { color: var(--green); }
  .match-status.scheduled { color: var(--muted); }
  .match-status.live { color: var(--red); }

  .team-row {
    display: flex;
    align-items: center;
    padding: 7px 10px;
    gap: 8px;
    transition: background 0.15s;
  }

  .team-row + .team-row { border-top: 1px solid rgba(30,58,110,0.5); }

  .team-row.winner {
    background: var(--winner-bg);
  }

  .team-flag-img {
    width: 22px;
    height: 16px;
    object-fit: cover;
    border-radius: 3px;
    background: #1a2a4a;
    flex-shrink: 0;
  }

  .team-flag-emoji {
    font-size: 1rem;
    line-height: 1;
    flex-shrink: 0;
    width: 22px;
    text-align: center;
  }

  .team-name {
    flex: 1;
    font-size: 0.8rem;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .team-row.winner .team-name { font-weight: 700; color: var(--green); }

  .team-score {
    font-size: 0.9rem;
    font-weight: 700;
    min-width: 18px;
    text-align: right;
    color: var(--text);
  }

  .team-row.winner .team-score { color: var(--green); }
  .score-dash { color: var(--muted); font-size: 0.8rem; }

  /* ── SCHEDULE VIEW ── */
  .schedule-wrap {
    max-width: 800px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }

  .day-group { margin-bottom: 28px; }

  .day-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .sched-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .sched-card:hover { background: var(--card-hover); }
  .sched-card.is-live { border-color: var(--red); }

  .sched-time { font-size: 0.75rem; color: var(--muted); min-width: 48px; text-align: center; }
  .sched-teams { flex: 1; }
  .sched-matchup { font-size: 0.88rem; font-weight: 600; }
  .sched-round { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }

  .sched-score {
    font-size: 1rem;
    font-weight: 700;
    min-width: 60px;
    text-align: center;
    color: var(--text);
  }

  .sched-status { font-size: 0.68rem; font-weight: 600; min-width: 52px; text-align: right; }
  .sched-status.live { color: var(--red); }
  .sched-status.finished { color: var(--green); }
  .sched-status.scheduled { color: var(--muted); }

  /* ── LEGEND ── */
  .legend {
    text-align: center;
    padding: 16px;
    font-size: 0.78rem;
    color: var(--muted);
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* ── LOADING ── */
  .loading {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── MODAL ── */
  .modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 999;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }

  .modal-bg.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    max-width: 400px;
    width: 90%;
    position: relative;
  }

  .modal-close {
    position: absolute;
    top: 14px;
    right: 16px;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.2rem;
    cursor: pointer;
  }

  .modal-round { font-size: 0.7rem; color: var(--gold); font-weight: 700; letter-spacing: 1px; margin-bottom: 12px; }
  .modal-teams { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; }
  .modal-score { font-size: 2rem; font-weight: 800; color: var(--gold); margin: 8px 0; }
  .modal-detail { font-size: 0.82rem; color: var(--muted); line-height: 1.8; }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.75rem;
    padding: 16px;
    border-top: 1px solid var(--border);
  }

  footer a { color: var(--blue); text-decoration: none; }
</style>
</head>
<body>

<div class="header">
  <div class="header-trophy">🏆</div>
  <h1>FIFA World Cup 2026</h1>
  <div class="header-sub">Canada · Mexico · USA &nbsp;·&nbsp; 48 Teams · Jun 11 – Jul 19, 2026</div>
  <div class="status-row">
    <span class="status-text" id="status-text">Loading…</span>
    <button class="btn btn-gold" id="refresh-btn">⟳ Refresh</button>
  </div>
  <div class="tab-row">
    <button class="tab active" data-view="bracket">Bracket</button>
    <button class="tab" data-view="schedule">Schedule</button>
  </div>
</div>

<div id="live-bar">
  <span class="live-bar-label">● LIVE NOW</span>
  <span id="live-chips"></span>
</div>

<div id="alert-box" class="alert"></div>

<div id="view-bracket">
  <div class="bracket-scroll">
    <div id="bracket" class="bracket">
      <div class="loading"><div class="spinner"></div>Fetching live data…</div>
    </div>
  </div>
  <div class="legend">
    <div class="legend-item"><span class="legend-dot" style="background:var(--red)"></span>Live</div>
    <div class="legend-item"><span class="legend-dot" style="background:var(--green)"></span>Finished</div>
    <div class="legend-item"><span class="legend-dot" style="background:var(--muted)"></span>Scheduled</div>
  </div>
</div>

<div id="view-schedule">
  <div class="schedule-wrap">
    <div id="schedule-list" class="loading"><div class="spinner"></div>Fetching live data…</div>
  </div>
</div>

<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <button class="modal-close" id="modal-close">✕</button>
    <div class="modal-round" id="modal-round"></div>
    <div class="modal-teams" id="modal-teams"></div>
    <div class="modal-score" id="modal-score"></div>
    <div class="modal-detail" id="modal-detail"></div>
  </div>
</div>

<footer>
  Live data via <a href="https://www.espn.com" target="_blank" rel="noopener">ESPN</a> · auto-refreshes every 60s
</footer>

<script>
// ──────────────────────────────────────────────
// CONFIG
// ──────────────────────────────────────────────
const ESPN_BASE = 'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world';
const REFRESH_MS = 60_000;

// World Cup 2026 knockout date ranges
const ROUND_DATES = [
  { label: 'Round of 32', start: '20260629', end: '20260703' },
  { label: 'Round of 16', start: '20260705', end: '20260709' },
  { label: 'Quarter-Final', start: '20260711', end: '20260713' },
  { label: 'Semi-Final', start: '20260715', end: '20260717' },
  { label: '3rd Place', start: '20260718', end: '20260718' },
  { label: 'Final', start: '20260719', end: '20260719' },
];

// ──────────────────────────────────────────────
// STATE
// ──────────────────────────────────────────────
let allEvents = [];
let activeView = 'bracket';

// ──────────────────────────────────────────────
// UTILS
// ──────────────────────────────────────────────
const $ = id => document.getElementById(id);

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });
}

function dateKey(iso) {
  if (!iso) return '';
  return iso.slice(0, 10).replace(/-/g, '');
}

function getRound(dateStr) {
  const d = dateStr || '';
  const compact = d.replace(/-/g, '').slice(0, 8);
  for (const r of ROUND_DATES) {
    if (compact >= r.start && compact <= r.end) return r.label;
  }
  return null;
}

function parseEvent(ev) {
  const comp = ev.competitions?.[0] || {};
  const comps = comp.competitors || [];
  const home = comps.find(c => c.homeAway === 'home') || comps[0] || {};
  const away = comps.find(c => c.homeAway === 'away') || comps[1] || {};
  const status = ev.status || {};
  const statusType = (status.type?.name || '').toUpperCase();
  const isLive = statusType === 'STATUS_IN_PROGRESS' || statusType.includes('HALFTIME');
  const isFinished = statusType === 'STATUS_FULL_TIME' || statusType === 'STATUS_FINAL' || statusType.includes('FINAL');
  const homeScore = home.score != null ? parseInt(home.score) : null;
  const awayScore = away.score != null ? parseInt(away.score) : null;
  const homeWin = homeScore !== null && awayScore !== null && homeScore > awayScore;
  const awayWin = homeScore !== null && awayScore !== null && awayScore > homeScore;
  return {
    id: ev.id,
    date: ev.date,
    dateKey: dateKey(ev.date),
    round: getRound(ev.date) || (comp.notes?.[0]?.headline || ''),
    home: { name: home.team?.displayName || home.team?.name || 'TBD', abbr: home.team?.abbreviation || '', logo: home.team?.logo || '', score: homeScore, winner: homeWin },
    away: { name: away.team?.displayName || away.team?.name || 'TBD', abbr: away.team?.abbreviation || '', logo: away.team?.logo || '', score: awayScore, winner: awayWin },
    isLive,
    isFinished,
    statusDetail: status.type?.detail || (isFinished ? 'Full Time' : isLive ? 'Live' : fmtTime(ev.date)),
    venue: comp.venue?.fullName || '',
    city: comp.venue?.address?.city || '',
  };
}

// ──────────────────────────────────────────────
// FETCH
// ──────────────────────────────────────────────
async function fetchDateRange(start, end) {
  const url = `${ESPN_BASE}/scoreboard?dates=${start}-${end}&limit=100`;
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(`ESPN ${res.status}`);
  const data = await res.json();
  return (data.events || []).map(parseEvent);
}

async function loadAll() {
  $('status-text').textContent = 'Refreshing…';
  showAlert('');

  try {
    // Fetch knockout rounds only (group stage excluded for bracket)
    const ranges = [
      ['20260629', '20260703'],
      ['20260705', '20260709'],
      ['20260711', '20260719'],
    ];

    const results = await Promise.all(ranges.map(([s, e]) => fetchDateRange(s, e).catch(() => [])));
    allEvents = results.flat().filter(e => e.round);

    if (allEvents.length === 0) {
      showAlert('No knockout fixtures found yet — the bracket will populate automatically once matches are confirmed.', 'info');
    }

    render();
    $('status-text').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (err) {
    console.error(err);
    showAlert('Could not reach live data — check your connection. Retrying in 60s.', 'error');
    $('status-text').textContent = 'Error – retrying…';
    if (allEvents.length === 0) renderPlaceholder();
  }
}

// ──────────────────────────────────────────────
// RENDER
// ──────────────────────────────────────────────
function render() {
  renderLiveBar();
  if (activeView === 'bracket') renderBracket();
  else renderSchedule();
}

function renderLiveBar() {
  const live = allEvents.filter(e => e.isLive);
  const bar = $('live-bar');
  if (!live.length) { bar.classList.remove('visible'); return; }
  bar.classList.add('visible');
  $('live-chips').innerHTML = live.map(e => `
    <span class="live-chip is-live">
      <span class="live-dot"></span>
      <strong>${e.home.abbr || e.home.name}</strong> ${e.home.score ?? '–'} – ${e.away.score ?? '–'} <strong>${e.away.abbr || e.away.name}</strong>
    </span>
  `).join('');
}

function renderBracket() {
  const container = $('bracket');
  const roundOrder = ROUND_DATES.map(r => r.label);
  const byRound = {};

  for (const ev of allEvents) {
    if (!byRound[ev.round]) byRound[ev.round] = [];
    byRound[ev.round].push(ev);
  }

  const rounds = roundOrder.filter(r => byRound[r]);

  if (!rounds.length) { renderPlaceholder(); return; }

  container.innerHTML = '';

  rounds.forEach((roundName, ri) => {
    const events = byRound[roundName];
    const isLast = ri === rounds.length - 1;

    const col = document.createElement('div');
    col.className = 'round-col';
    col.style.cssText = `display:flex; flex-direction:column; align-items:stretch;`;

    const label = document.createElement('div');
    label.className = 'round-label';
    label.textContent = roundName;
    col.appendChild(label);

    const matchesWrap = document.createElement('div');
    matchesWrap.style.cssText = `display:flex; flex-direction:column; justify-content:space-around; gap:12px; padding: 4px 0; flex:1;`;

    events.forEach(ev => {
      const wrap = document.createElement('div');
      wrap.className = 'match-wrap';

      if (ri > 0) {
        const connL = document.createElement('div');
        connL.className = 'connector left';
        connL.style.cssText = 'width:20px; height:1px; background:var(--connector); flex-shrink:0;';
        wrap.appendChild(connL);
      }

      wrap.appendChild(buildMatchCard(ev));

      if (!isLast) {
        const connR = document.createElement('div');
        connR.className = 'connector right';
        connR.style.cssText = 'width:20px; height:1px; background:var(--connector); flex-shrink:0;';
        wrap.appendChild(connR);
      }

      matchesWrap.appendChild(wrap);
    });

    col.appendChild(matchesWrap);
    container.appendChild(col);
  });
}

function buildMatchCard(ev) {
  const card = document.createElement('div');
  card.className = 'match-card' + (ev.isLive ? ' is-live' : '');

  const statusCls = ev.isLive ? 'live' : ev.isFinished ? 'finished' : 'scheduled';
  const statusLabel = ev.isLive ? '● Live' : ev.isFinished ? 'Full Time' : fmtTime(ev.date) || 'TBD';

  card.innerHTML = `
    <div class="match-meta">
      <span class="match-date">${fmtDate(ev.date)}</span>
      <span class="match-status ${statusCls}">${statusLabel}</span>
    </div>
    ${teamRow(ev.home)}
    ${teamRow(ev.away)}
  `;

  card.addEventListener('click', () => openModal(ev));
  return card;
}

function teamRow(team) {
  const winClass = team.winner ? ' winner' : '';
  const score = team.score !== null && team.score !== undefined
    ? `<span class="team-score">${team.score}</span>`
    : `<span class="team-score score-dash">–</span>`;
  const logoHtml = team.logo
    ? `<img class="team-flag-img" src="${team.logo}" alt="" onerror="this.style.display='none'">`
    : '';
  return `<div class="team-row${winClass}">${logoHtml}<span class="team-name">${team.name || 'TBD'}</span>${score}</div>`;
}

function renderPlaceholder() {
  const container = $('bracket');
  container.innerHTML = '';
  const rounds = [
    { label: 'Round of 32', count: 16 },
    { label: 'Round of 16', count: 8 },
    { label: 'Quarter-Final', count: 4 },
    { label: 'Semi-Final', count: 2 },
    { label: 'Final', count: 1 },
  ];
  rounds.forEach(r => {
    const col = document.createElement('div');
    col.className = 'round-col';
    col.style.cssText = 'display:flex; flex-direction:column; align-items:stretch;';
    const label = document.createElement('div');
    label.className = 'round-label';
    label.textContent = r.label;
    col.appendChild(label);
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;justify-content:space-around;gap:12px;padding:4px 0;flex:1;';
    for (let i = 0; i < r.count; i++) {
      const card = document.createElement('div');
      card.className = 'match-card';
      card.innerHTML = `
        <div class="match-meta"><span class="match-date">TBD</span><span class="match-status scheduled">Scheduled</span></div>
        <div class="team-row"><span class="team-name" style="color:var(--muted)">TBD</span><span class="team-score score-dash">–</span></div>
        <div class="team-row"><span class="team-name" style="color:var(--muted)">TBD</span><span class="team-score score-dash">–</span></div>
      `;
      const mwrap = document.createElement('div');
      mwrap.className = 'match-wrap';
      mwrap.appendChild(card);
      wrap.appendChild(mwrap);
    }
    col.appendChild(wrap);
    container.appendChild(col);
  });
}

function renderSchedule() {
  const list = $('schedule-list');
  if (!allEvents.length) {
    list.innerHTML = '<div class="loading"><div class="spinner"></div>No data yet.</div>';
    return;
  }
  const sorted = [...allEvents].sort((a, b) => new Date(a.date) - new Date(b.date));
  const byDay = {};
  for (const ev of sorted) {
    const day = fmtDate(ev.date) || 'TBD';
    if (!byDay[day]) byDay[day] = [];
    byDay[day].push(ev);
  }
  list.innerHTML = '';
  for (const [day, events] of Object.entries(byDay)) {
    const grp = document.createElement('div');
    grp.className = 'day-group';
    grp.innerHTML = `<div class="day-label">${day} · ${events[0].round}</div>`;
    for (const ev of events) {
      const statusCls = ev.isLive ? 'live' : ev.isFinished ? 'finished' : 'scheduled';
      const statusLabel = ev.isLive ? '● Live' : ev.isFinished ? 'FT' : 'Sched';
      const scoreStr = ev.home.score !== null && ev.away.score !== null
        ? `${ev.home.score} – ${ev.away.score}`
        : 'vs';
      const card = document.createElement('div');
      card.className = 'sched-card' + (ev.isLive ? ' is-live' : '');
      card.innerHTML = `
        <div class="sched-time">${fmtTime(ev.date).split(' ')[0] || 'TBD'}</div>
        <div class="sched-teams">
          <div class="sched-matchup">${ev.home.name} vs ${ev.away.name}</div>
          <div class="sched-round">${ev.round}${ev.venue ? ' · ' + ev.city : ''}</div>
        </div>
        <div class="sched-score">${scoreStr}</div>
        <div class="sched-status ${statusCls}">${statusLabel}</div>
      `;
      card.addEventListener('click', () => openModal(ev));
      grp.appendChild(card);
    }
    list.appendChild(grp);
  }
}

// ──────────────────────────────────────────────
// MODAL
// ──────────────────────────────────────────────
function openModal(ev) {
  $('modal-round').textContent = ev.round;
  $('modal-teams').textContent = `${ev.home.name} vs ${ev.away.name}`;
  const scoreStr = ev.home.score !== null && ev.away.score !== null
    ? `${ev.home.score} – ${ev.away.score}`
    : '–';
  $('modal-score').textContent = scoreStr;
  $('modal-detail').innerHTML = [
    ev.isLive ? '<strong style="color:var(--red)">● IN PROGRESS</strong>' : '',
    ev.isFinished ? `<strong style="color:var(--green)">Full Time</strong>` : '',
    `📅 ${fmtDate(ev.date)} · ${fmtTime(ev.date)}`,
    ev.venue ? `🏟 ${ev.venue}${ev.city ? ', ' + ev.city : ''}` : '',
    ev.home.winner ? `🏆 Winner: ${ev.home.name}` : ev.away.winner ? `🏆 Winner: ${ev.away.name}` : '',
  ].filter(Boolean).join('<br>');
  $('modal-bg').classList.add('open');
}

// ──────────────────────────────────────────────
// ALERT
// ──────────────────────────────────────────────
function showAlert(msg, type = '') {
  const el = $('alert-box');
  if (!msg) { el.className = 'alert'; el.textContent = ''; return; }
  el.className = `alert ${type}`;
  el.textContent = msg;
}

// ──────────────────────────────────────────────
// EVENTS
// ──────────────────────────────────────────────
$('refresh-btn').addEventListener('click', loadAll);

$('modal-close').addEventListener('click', () => $('modal-bg').classList.remove('open'));
$('modal-bg').addEventListener('click', e => { if (e.target === $('modal-bg')) $('modal-bg').classList.remove('open'); });

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeView = tab.dataset.view;
    $('view-bracket').style.display = activeView === 'bracket' ? 'block' : 'none';
    $('view-schedule').style.display = activeView === 'schedule' ? 'block' : 'none';
    render();
  });
});

// ──────────────────────────────────────────────
// INIT
// ──────────────────────────────────────────────
loadAll();
setInterval(loadAll, REFRESH_MS);
</script>
</body>
</html>
